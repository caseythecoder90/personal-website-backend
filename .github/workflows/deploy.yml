name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Rolls out to the Hetzner Kubernetes cluster (k8s-cluster-hetzner repo).
  # KUBE_CONFIG is a base64 kubeconfig for the least-privilege `ci-deployer`
  # ServiceAccount in the personal-website namespace — it can update Deployment
  # images there and nothing else.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.13          # matches the cluster

      - name: Configure cluster access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Roll out the new image
        run: |
          # short SHA matches docker/metadata-action's `type=sha,prefix=` tag
          TAG=${GITHUB_SHA::7}
          kubectl -n personal-website set image deploy/backend \
            backend=ghcr.io/caseythecoder90/personal-website-backend:$TAG
          kubectl -n personal-website rollout status deploy/backend --timeout=300s

      - name: Show pod state if the rollout failed
        if: failure()
        run: |
          kubectl -n personal-website get pods -l app=backend
          kubectl -n personal-website logs -l app=backend --tail=50 --all-containers || true
