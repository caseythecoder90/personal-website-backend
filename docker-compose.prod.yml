# Personal-website app stack. Ports 80/443, TLS, and all reverse-proxy routing
# now live in the standalone edge-proxy stack (/opt/edge-proxy) — this stack no
# longer runs nginx or certbot. `app` and `frontend` join the shared external
# `edge` network so the edge proxy can reach them by container name; the data
# tier (postgres, redis) stays on the private app-network only.
services:
  app:
    image: ghcr.io/caseythecoder90/personal-website-backend:latest
    container_name: personal-website-app
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app-network   # reach postgres + redis
      - edge          # reachable by the edge proxy (api.caseyrquinn.com)

  frontend:
    image: ghcr.io/caseythecoder90/personal-website-frontend:latest
    container_name: personal-website-frontend
    restart: unless-stopped
    networks:
      - edge          # static SPA; only the edge proxy needs to reach it

  postgres:
    image: postgres:16-alpine
    container_name: personal-website-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network   # private data tier — NOT on edge

  redis:
    image: redis:7-alpine
    container_name: personal-website-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network   # private data tier — NOT on edge

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
  # Shared reverse-proxy network, created once on the host (`docker network create
  # edge`) and owned by no single stack. Only app + frontend join it here.
  edge:
    external: true
    name: edge